name: PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Application Tests & Build (Adjust for Go/Java as needed)
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Application Unit Tests
        run: go test -v ./...

      # 2. Terraform Security & Validation
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform Init (Dev Backend)
        run: terraform init "-backend-config=environments/dev/backend.tfbackend" -reconfigure
        working-directory: terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform

      - name: Native Terraform Tests
        run: terraform test
        working-directory: terraform

      # 3. Container Security & Local Image Build
      - name: Build Local Container Image
        run: docker build -t app:${{ github.sha }} .

      - name: Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: 'app:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'